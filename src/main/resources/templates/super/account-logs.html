<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>账户操作记录 · 企业员工考勤管理系统</title>
<link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
<link rel="icon" sizes="any" th:href="@{/favicon.ico}">
<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{layout/frame :: sidebar}"></div>
<div class="main">
  <header th:replace="~{layout/frame :: topbar}"></header>
  <div class="content">
    <div class="crumbs">超级管理员系统 / 账户操作记录</div>
    <div class="page-head">
      <div><h1>账户操作记录</h1><p>账户全生命周期审计流水 · <span th:text="${zoneLabel}">北京时间 (UTC+8)</span> · 含地点变更与失败/越权被拒记录</p></div>
      <div class="page-actions" th:if="${false}"></div>
    </div>
    <div class="alert alert-success" th:if="${msg}" th:text="${msg}"></div>
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

<div class="grid grid-3">
  <div class="kpi blue"><div><div class="kpi-label">累计操作记录</div><div class="kpi-value" th:text="${total}">0</div><div class="kpi-foot">账户管理全量审计</div></div></div>
  <div class="kpi green"><div><div class="kpi-label">今日操作</div><div class="kpi-value" th:text="${today}">0</div><div class="kpi-foot">当日账户变更</div></div></div>
  <div class="kpi amber"><div><div class="kpi-label">操作类型</div><div class="kpi-value" th:text="${#lists.size(actionStats)}">0</div><div class="kpi-foot">CREATE / UPDATE / DELETE 等</div></div></div>
</div>
<div class="card">
  <div class="card-head"><h2>账户操作记录</h2><span class="sub">仅超级管理员可见</span></div>
  <form class="toolbar" th:action="@{/super/account-logs}" method="get">
    <div class="field grow"><label>操作人 / 目标账号 / 摘要</label><input type="text" name="keyword" th:value="${keyword}" placeholder="输入关键词"></div>
    <button class="btn" type="submit">查询</button></form>
  <div class="card-body flush"><div class="table-wrap"><table class="tbl">
    <thead><tr><th>时间</th><th>操作人</th><th>操作人角色</th><th>操作</th><th>目标账号</th><th>目标角色</th><th>变更摘要</th><th>IP</th><th>结果</th></tr></thead>
    <tbody><tr th:each="l : ${rows}">
      <td><span data-dt th:attr="data-dt=${l.createTime}"></span></td>
      <td th:text="${l.operator}">-</td><td><span class="badge" th:attr="data-status=${l.operatorRole}">-</span></td>
      <td><span class="tag" th:text="${actionName.get(l.action)}">-</span></td>
      <td th:text="${l.targetUser}">-</td><td th:text="${l.targetRole}">-</td>
      <td th:text="${l.detail}">-</td><td th:text="${l.ip}">-</td>
      <td><span class="badge" th:attr="data-status=${l.result}">-</span></td></tr>
      <tr th:if="${#lists.isEmpty(rows)}"><td colspan="9" class="tbl-empty">暂无操作记录</td></tr>
    </tbody></table></div></div>
</div>
<div class="card"><div class="card-head"><h2>操作类型分布</h2></div><div class="card-body flush">
  <div class="table-wrap"><table class="tbl"><thead><tr><th>操作类型</th><th>次数</th></tr></thead>
  <tbody><tr th:each="a : ${actionStats}"><td th:text="${actionName.get(a.action)}">-</td><td th:text="${a.cnt}">0</td></tr>
  <tr th:if="${#lists.isEmpty(actionStats)}"><td colspan="2" class="tbl-empty">暂无数据</td></tr></tbody></table></div></div></div>

  </div>
  <div th:replace="~{layout/frame :: footer}"></div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
