<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>员工账号 · 超级管理员系统</title>
<link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
<link rel="icon" sizes="any" th:href="@{/favicon.ico}">
<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{layout/frame :: sidebar}"></div>
<div class="main">
  <header th:replace="~{layout/frame :: topbar}"></header>
  <div class="content">
    <div class="crumbs">超级管理员系统 / 员工账号</div>
    <div class="page-head"><div><h1>员工账号</h1><p>全量员工账户 · 状态管理 · 新增 / 编辑 / 删除（不受 created_by 归属限制）</p></div></div>
    <div class="alert alert-success" th:if="${msg}" th:text="${msg}"></div>
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

<div class="card">
  <div class="card-head"><h2>员工账号列表</h2><div class="page-actions">
    <button class="btn btn-primary btn-sm" onclick="openCreate()">＋ 添加员工账号</button>
    <a class="btn btn-sm" th:href="@{/super/account-logs}">操作记录</a>
    <a class="btn btn-sm" th:href="@{/super/permissions}">权限边界</a></div></div>
  <form class="toolbar" th:action="@{/super/employees}" method="get">
    <div class="field grow"><label>账号 / 姓名</label><input type="text" name="keyword" th:value="${keyword}"></div>
    <div class="field"><label>部门</label><select name="deptId"><option value="">全部部门</option>
      <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"
              th:selected="${deptId != null and deptId == d.id}">部门</option></select></div>
    <button class="btn btn-primary" type="submit">查询</button>
  </form>
  <div class="card-body flush"><div class="table-wrap"><table class="tbl">
    <thead><tr><th>ID</th><th>登录账号</th><th>姓名</th><th>角色</th><th>关联员工</th><th>部门</th><th>状态</th><th>创建人</th><th>操作</th></tr></thead>
    <tbody><tr th:each="r : ${rows}">
      <td th:text="${r.id}">0</td><td><b th:text="${r.username}">-</b></td><td th:text="${r.realName}">-</td>
      <td><span class="badge" th:attr="data-status=${r.role}" th:text="${roleName.get(r.role)}">-</span></td>
      <td th:text="${r.employeeName}">-</td><td th:text="${r.deptName}">-</td>
      <td><span class="badge" th:attr="data-status=${r.enabled != null and r.enabled ? '1' : '0'}" th:text="${r.enabled != null and r.enabled ? '启用' : '停用'}">-</span></td>
      <td th:text="${r.createdBy}">-</td>
      <td class="nowrap">
        <button class="btn btn-sm" type="button" onclick="openEdit(this)"
          th:attr="data-id=${r.id},data-u=${r.username},data-n=${r.realName},data-emp=${r.employeeId},data-rolename=${roleName.get(r.role)},data-phone=${r.phone},data-email=${r.email},data-enabled=${r.enabled}">编辑</button>
        <form th:action="@{/super/employees/toggle/{id}(id=${r.id})}" method="post" style="display:inline"><button class="btn btn-sm" type="submit" th:text="${r.enabled ? '停用' : '启用'}">停用</button></form>
        <form th:action="@{/super/employees/reset/{id}(id=${r.id})}" method="post" style="display:inline"><button class="btn btn-sm" type="submit">重置密码</button></form>
        <form th:action="@{/super/employees/delete/{id}(id=${r.id})}" method="post" style="display:inline" data-confirm="确认删除该员工账号？"><button class="btn btn-sm btn-danger" type="submit">删除</button></form>
      </td></tr>
      <tr th:if="${#lists.isEmpty(rows)}"><td colspan="9" class="tbl-empty">暂无员工账号</td></tr>
    </tbody></table></div></div>
  <div class="pager"><span class="info">共 <b th:text="${total}">0</b> 个员工账号</span></div>
</div>

<div class="card"><div class="card-head"><h2>权限边界</h2></div><div class="card-body">
  <div class="hint">· 超级管理员可查看 / 管理<b>全部</b>管理员账号与员工账号，也可维护部门信息与打卡地点。</div>
  <div class="hint">· 管理员只能管理员工级账号，且看不到管理员及以上账户。</div>
  <div class="hint">· 每次账户变更写入 <code>sys_account_log</code>，成功与失败（越权被拒）都留痕。</div>
</div></div>

<div class="modal-mask" id="empModal" style="display:none" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal">
    <div class="modal-head"><h3>添加 / 编辑员工账号</h3><button type="button" class="icon-btn" onclick="document.getElementById('empModal').style.display='none'">✕</button></div>
    <div class="modal-body"><form th:action="@{/super/employees/save}" method="post">
      <input type="hidden" name="id" id="e-id"><input type="hidden" name="create" id="e-create" value="true">
      <div class="form-grid">
        <div class="field req"><label>登录账号</label><input type="text" name="username" id="e-username" required></div>
        <div class="field req"><label>姓名</label><input type="text" name="realName" id="e-realname" required></div>
        <div class="field"><label>角色</label><select name="roleId" id="e-role">
          <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.name}">角色</option></select></div>
        <div class="field"><label>关联员工档案</label><select name="employeeId" id="e-emp"><option value="">不关联</option>
          <option th:each="e : ${employees}" th:value="${e.id}" th:text="${e.name} + '（' + ${e.employeeNo} + '）'">员工</option></select></div>
        <div class="field"><label>初始密码</label><input type="text" name="password" id="e-pwd" value="123456" placeholder="编辑留空则不改"></div>
        <div class="field"><label>手机号</label><input type="text" name="phone" id="e-phone"></div>
        <div class="field"><label>邮箱</label><input type="email" name="email" id="e-email"></div>
        <div class="field"><label>状态</label><select name="enabled" id="e-enabled"><option value="true">启用</option><option value="false">停用</option></select></div>
      </div>
      <div class="form-actions"><button type="button" class="btn" onclick="document.getElementById('empModal').style.display='none'">取消</button><button class="btn btn-primary" type="submit">保存</button></div>
    </form></div>
  </div>
</div>
<script>
function openCreate(){
  ['e-id','e-username','e-realname','e-phone','e-email'].forEach(function(i){document.getElementById(i).value='';});
  document.getElementById('e-create').value='true';
  document.getElementById('e-pwd').value='123456';
  document.getElementById('e-username').removeAttribute('readonly');
  document.getElementById('e-emp').value='';
  document.getElementById('e-enabled').value='true';
  document.getElementById('empModal').style.display='flex';
}
function openEdit(btn){
  var d=btn.dataset;
  document.getElementById('e-create').value='false';
  document.getElementById('e-id').value=d.id;
  document.getElementById('e-username').value=d.u;
  document.getElementById('e-username').setAttribute('readonly','readonly');
  document.getElementById('e-realname').value=(!d.n||d.n==='null')?'':d.n;
  document.getElementById('e-pwd').value='';
  document.getElementById('e-phone').value=(!d.phone||d.phone==='null')?'':d.phone;
  document.getElementById('e-email').value=(!d.email||d.email==='null')?'':d.email;
  document.getElementById('e-emp').value=(!d.emp||d.emp==='null')?'':d.emp;
  document.getElementById('e-enabled').value=String(d.enabled);
  var sel=document.getElementById('e-role');
  for(var i=0;i<sel.options.length;i++){ if(sel.options[i].text===d.rolename) sel.selectedIndex=i; }
  document.getElementById('empModal').style.display='flex';
}
</script>

  </div>
  <div th:replace="~{layout/frame :: footer}"></div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
