<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>异常考勤 · 企业员工考勤管理系统</title>
<link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
<link rel="icon" sizes="any" th:href="@{/favicon.ico}">
<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{layout/frame :: sidebar}"></div>
<div class="main">
  <header th:replace="~{layout/frame :: topbar}"></header>
  <div class="content">
    <div class="crumbs">管理员系统 / 考勤管理 / 异常考勤</div>
    <div class="page-head">
      <div><h1>异常考勤</h1><p>迟到 / 早退 / 旷工 / 缺卡集中核查</p></div>
    </div>
    <div class="alert alert-success" th:if="${msg}" th:text="${msg}"></div>
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

<div class="card"><div class="card-head"><h2>异常类型分布</h2></div><div class="card-body">
  <div style="display:flex;flex-wrap:wrap;gap:10px">
    <span class="badge" th:each="e : ${byType}" th:attr="data-status=${e.key}" th:text="${e.key} + ' · ' + ${e.value} + ' 条'">-</span>
    <span class="muted" th:if="${#maps.isEmpty(byType)}">暂无异常</span></div></div></div>
<div class="card"><div class="card-head"><h2>异常明细</h2></div>
<form class="toolbar" th:action="@{/admin/attendance/exceptions}" method="get"><div class="field"><label>开始日期</label><input type="date" name="startDate" th:value="${startDate}"></div><div class="field"><label>结束日期</label><input type="date" name="endDate" th:value="${endDate}"></div><div class="field"><label>部门</label><select name="deptId"><option value="">全部部门</option><option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}" th:selected="${deptId != null and deptId == d.id}">部门</option></select></div><button class="btn btn-primary" type="submit">查询</button></form>
<div class="card-body flush"><div class="table-wrap"><table class="tbl"><thead><tr><th>日期</th><th>工号</th><th>姓名</th><th>部门</th><th>状态</th><th>上班</th><th>下班</th><th>迟到(分)</th><th>早退(分)</th><th>备注</th></tr></thead><tbody><tr th:each="r : ${rows}"><td th:text="${r.attendanceDate}">-</td><td th:text="${r.employeeNo}">-</td>
      <td th:text="${r.employeeName}">-</td><td th:text="${r.departmentName}">-</td>
      <td><span class="badge" th:attr="data-status=${r.status}">-</span></td>
      <td><span data-dt th:attr="data-dt=${r.checkInTime}"></span></td><td><span data-dt th:attr="data-dt=${r.checkOutTime}"></span></td>
      <td th:text="${r.lateMinutes}">0</td><td th:text="${r.earlyMinutes}">0</td><td th:text="${r.remark}">-</td></tr><tr th:if="${#lists.isEmpty(rows)}"><td colspan="10" class="tbl-empty">近 30 日无异常考勤</td></tr></tbody></table></div></div></div>
  </div>
  <div th:replace="~{layout/frame :: footer}"></div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
