<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>员工账号 · 企业员工考勤管理系统</title>
<link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
<link rel="icon" sizes="any" th:href="@{/favicon.ico}">
<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{layout/frame :: sidebar}"></div>
<div class="main">
  <header th:replace="~{layout/frame :: topbar}"></header>
  <div class="content">
    <div class="crumbs">管理员系统 / 系统管理 / 员工账号</div>
    <div class="page-head">
      <div><h1>员工账号</h1><p>账户列表 · 状态管理 · 新增 / 编辑 / 删除</p></div>
    </div>
    <div class="alert alert-success" th:if="${msg}" th:text="${msg}"></div>
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

<div class="card"><div class="card-head"><h2>员工账号</h2><div class="page-actions">
  <button class="btn btn-primary btn-sm" onclick="openUser()">＋ 添加员工账号</button>
  <a class="btn btn-sm" th:href="@{/admin/employees}">员工档案</a></div></div>
<form class="toolbar" th:action="@{/admin/system/users}" method="get"><div class="field grow"><label>账号 / 姓名</label><input type="text" name="keyword" th:value="${keyword}"></div><div class="field"><label>部门</label><select name="deptId"><option value="">全部部门</option><option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}" th:selected="${deptId != null and deptId == d.id}">部门</option></select></div><button class="btn btn-primary" type="submit">查询</button></form>
<div class="card-body flush"><div class="table-wrap"><table class="tbl"><thead><tr><th>ID</th><th>登录账号</th><th>姓名</th><th>角色</th><th>关联员工</th><th>部门</th><th>状态</th><th>创建人</th><th>最后登录</th><th>操作</th></tr></thead><tbody><tr th:each="r : ${rows}"><td th:text="${r.id}">0</td><td><b th:text="${r.username}">-</b></td>
      <td th:text="${r.realName}">-</td><td><span class="badge" th:attr="data-status=${r.role}">-</span></td>
      <td th:text="${r.employeeName}">-</td><td th:text="${r.deptName}">-</td>
      <td><span class="badge" th:attr="data-status=${r.enabled ? '1' : '0'}">-</span></td>
      <td th:text="${r.createdBy}">-</td><td><span data-dt th:attr="data-dt=${r.lastLoginTime}"></span></td>
      <td class="nowrap"><button class="btn btn-sm" type="button" onclick="editUser(this)"
          th:attr="data-id=${r.id},data-u=${r.username},data-n=${r.realName},data-emp=${r.employeeId},data-phone=${r.phone},data-email=${r.email},data-enabled=${r.enabled}">编辑</button>
        <form th:action="@{/admin/system/users/toggle/{id}(id=${r.id})}" method="post" style="display:inline"><button class="btn btn-sm" type="submit" th:text="${r.enabled ? '停用' : '启用'}">停用</button></form>
        <form th:action="@{/admin/system/users/reset/{id}(id=${r.id})}" method="post" style="display:inline"><button class="btn btn-sm" type="submit">重置密码</button></form>
        <form th:action="@{/admin/system/users/delete/{id}(id=${r.id})}" method="post" style="display:inline" data-confirm="确认删除该员工账号？"><button class="btn btn-sm btn-danger" type="submit">删除</button></form></td></tr><tr th:if="${#lists.isEmpty(rows)}"><td colspan="10" class="tbl-empty">暂无员工账号，点击右上角添加</td></tr></tbody></table></div></div></div>
<div class="card"><div class="card-head"><h2>权限边界</h2></div><div class="card-body">
  <div class="hint">· 管理员只能创建 / 编辑 / 删除 <b>员工级</b>账号，无法查看或操作管理员及以上账户。</div>
  <div class="hint">· 超级管理员在「超级管理员系统 → 管理员账户」中管理管理员账户，两类账户列表互不可见。</div>
  <div class="hint">· 所有账户变更写入账户操作记录，仅超级管理员可审计。</div>
</div></div>
<div class="modal-mask" id="userModal" style="display:none" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal">
    <div class="modal-head"><h3>添加 / 编辑员工账号</h3><button type="button" class="icon-btn" onclick="document.getElementById('userModal').style.display='none'">✕</button></div>
    <div class="modal-body"><form th:action="@{/admin/system/users/save}" method="post">
  <input type="hidden" name="id" id="u-id"><input type="hidden" name="create" id="u-create" value="true">
  <input type="hidden" name="role" value="EMPLOYEE">
  <div class="form-grid">
    <div class="field req"><label>登录账号</label><input type="text" name="username" id="u-username" required></div>
    <div class="field req"><label>姓名</label><input type="text" name="realName" id="u-realname" required></div>
    <div class="field"><label>关联员工档案</label><select name="employeeId" id="u-emp"><option value="">不关联</option>
      <option th:each="e : ${employees}" th:value="${e.id}" th:text="${e.name} + '（' + ${e.employeeNo} + '）'">员工</option></select></div>
    <div class="field"><label>初始密码</label><input type="text" name="plainPassword" id="u-pwd" value="123456"></div>
    <div class="field"><label>手机号</label><input type="text" name="phone" id="u-phone"></div>
    <div class="field"><label>邮箱</label><input type="email" name="email" id="u-email"></div>
    <div class="field"><label>状态</label><select name="enabled" id="u-enabled"><option value="true">启用</option><option value="false">停用</option></select></div>
  </div><div class="form-actions"><button type="button" class="btn" onclick="document.getElementById('userModal').style.display='none'">取消</button><button class="btn btn-primary" type="submit">保存</button></div>
</form></div>
  </div>
</div>
<script>
function openUser(){['u-id','u-username','u-realname','u-phone','u-email'].forEach(function(i){document.getElementById(i).value='';});document.getElementById('u-create').value='true';document.getElementById('u-pwd').value='123456';document.getElementById('u-username').removeAttribute('readonly');document.getElementById('userModal').style.display='flex';}
function editUser(b){var d=b.dataset,map={'u-id':'id','u-username':'u','u-realname':'n','u-emp':'emp','u-phone':'phone','u-email':'email','u-enabled':'enabled'};
  for(var i in map){var v=d[map[i]];document.getElementById(i).value=(v==='null'||v===undefined)?'':v;}
  document.getElementById('u-create').value='false';document.getElementById('u-pwd').value='';document.getElementById('u-username').setAttribute('readonly','readonly');document.getElementById('userModal').style.display='flex';}
</script>
  </div>
  <div th:replace="~{layout/frame :: footer}"></div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
