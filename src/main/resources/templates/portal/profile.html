<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人中心 · 企业员工考勤管理系统</title>
<link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
<link rel="icon" sizes="any" th:href="@{/favicon.ico}">
<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{layout/frame :: sidebar}"></div>
<div class="main">
  <header th:replace="~{layout/frame :: topbar}"></header>
  <div class="content">
    <div class="crumbs">员工系统 / 个人中心</div>
    <div class="page-head">
      <div><h1>个人中心</h1><p>个人档案 · 账户安全</p></div>
    </div>
    <div class="alert alert-success" th:if="${msg}" th:text="${msg}"></div>
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

<div class="grid grid-2">
  <div class="card"><div class="card-head"><h2>个人档案</h2></div><div class="card-body">
    <form th:action="@{/my/profile/update}" method="post">
      <div class="form-grid">
        <div class="field"><label>工号</label><input type="text" th:value="${employee != null ? employee.employeeNo : ''}" readonly></div>
        <div class="field"><label>姓名</label><input type="text" th:value="${employee != null ? employee.name : ''}" readonly></div>
        <div class="field"><label>部门</label><input type="text" th:value="${employee != null ? employee.departmentName : ''}" readonly></div>
        <div class="field"><label>岗位</label><input type="text" th:value="${employee != null ? employee.position : ''}" readonly></div>
        <div class="field"><label>手机号</label><input type="text" name="phone" th:value="${employee != null ? employee.phone : ''}"></div>
        <div class="field"><label>邮箱</label><input type="email" name="email" th:value="${employee != null ? employee.email : ''}"></div>
        <div class="field full"><label>联系地址</label><input type="text" name="address" th:value="${employee != null ? employee.address : ''}"></div>
      </div>
      <div class="form-actions"><button class="btn btn-primary" type="submit">保存资料</button></div>
    </form></div></div>
  <div class="card"><div class="card-head"><h2>账户安全</h2></div><div class="card-body">
    <div class="kv"><div><span class="k">登录账号</span><span class="v" th:text="${user != null ? user.username : '-'}">-</span></div>
      <div><span class="k">角色</span><span class="v"><span class="badge" th:attr="data-status=${user != null ? user.role : ''}">-</span></span></div></div>
    <div class="kv"><div><span class="k">最近登录</span><span class="v"><span data-dt th:attr="data-dt=${user != null ? user.lastLoginTime : ''}"></span></span></div>
      <div><span class="k">登录 IP</span><span class="v" th:text="${user != null ? user.lastLoginIp : '-'}">-</span></div></div>
    <form th:action="@{/my/profile/password}" method="post" style="margin-top:18px">
      <div class="field"><label>原密码</label><input type="password" name="oldPassword" required></div>
      <div class="field" style="margin-top:14px"><label>新密码（不少于 6 位）</label><input type="password" name="newPassword" minlength="6" required></div>
      <div class="form-actions"><button class="btn btn-primary" type="submit">修改密码</button></div>
    </form>
    <div class="hint">账号与角色由管理员分配，员工本人仅可维护联系方式与登录密码。</div>
  </div></div>
</div>

  </div>
  <div th:replace="~{layout/frame :: footer}"></div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
