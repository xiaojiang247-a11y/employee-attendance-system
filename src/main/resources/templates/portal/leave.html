<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的请假 · 企业员工考勤管理系统</title>
<link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
<link rel="icon" sizes="any" th:href="@{/favicon.ico}">
<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{layout/frame :: sidebar}"></div>
<div class="main">
  <header th:replace="~{layout/frame :: topbar}"></header>
  <div class="content">
    <div class="crumbs">员工系统 / 我的请假</div>
    <div class="page-head">
      <div><h1>我的请假</h1><p>假期余额 · 在线申请 · 审批进度</p></div>
    </div>
    <div class="alert alert-success" th:if="${msg}" th:text="${msg}"></div>
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

<div class="grid grid-1-2">
  <div class="card"><div class="card-head"><h2>申请请假</h2></div><div class="card-body">
    <form th:action="@{/my/leave/apply}" method="post">
      <div class="field"><label>假别</label><select name="typeCode" required>
        <option th:each="t : ${types}" th:value="${t.code}" th:text="${t.name} + '（余额 ' + ${t.annualQuota} + ' 天）'">假别</option></select></div>
      <div class="field" style="margin-top:14px"><label>开始日期</label><input type="date" name="startDate" required></div>
      <div class="field" style="margin-top:14px"><label>结束日期</label><input type="date" name="endDate" required></div>
      <div class="field" style="margin-top:14px"><label>请假事由</label><textarea name="reason" rows="3" required></textarea></div>
      <div class="form-actions"><button class="btn btn-primary" type="submit">提交申请</button></div>
    </form>
    <div class="hint">请假天数按工作日自动折算，审批通过后扣减对应假期额度并回写考勤状态。</div>
  </div></div>
  <div class="card"><div class="card-head"><h2>我的假期额度</h2><span class="sub">本年度</span></div>
    <div class="card-body flush"><div class="table-wrap"><table class="tbl">
      <thead><tr><th>假别</th><th>总额度</th><th>已使用</th><th>剩余</th></tr></thead>
      <tbody><tr th:each="b : ${balances}"><td th:text="${b.typeName}">-</td>
        <td th:text="${b.totalDays}">0</td><td th:text="${b.usedDays}">0</td>
        <td><b th:text="${b.remainDays}">0</b></td></tr>
        <tr th:if="${#lists.isEmpty(balances)}"><td colspan="4" class="tbl-empty">暂无额度，请联系人事发放</td></tr>
      </tbody></table></div></div></div>
</div>
<div class="card"><div class="card-head"><h2>我的请假单</h2></div>
  <div class="card-body flush"><div class="table-wrap"><table class="tbl">
    <thead><tr><th>假别</th><th>开始</th><th>结束</th><th>天数</th><th>事由</th><th>申请时间</th><th>状态</th><th>操作</th></tr></thead>
    <tbody><tr th:each="r : ${rows}">
      <td th:text="${r.typeName}">-</td><td th:text="${r.startDate}">-</td><td th:text="${r.endDate}">-</td>
      <td th:text="${r.days}">0</td><td th:text="${r.reason}">-</td>
      <td><span data-dt th:attr="data-dt=${r.applyTime}"></span></td>
      <td><span class="badge" th:attr="data-status=${r.status}">-</span></td>
      <td><form th:action="@{/my/leave/cancel/{id}(id=${r.id})}" method="post" th:if="${r.status == 'PENDING'}"><button class="btn btn-sm btn-danger" type="submit">撤销</button></form></td>
    </tr><tr th:if="${#lists.isEmpty(rows)}"><td colspan="8" class="tbl-empty">暂无请假记录</td></tr></tbody></table></div></div>
</div>

  </div>
  <div th:replace="~{layout/frame :: footer}"></div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
