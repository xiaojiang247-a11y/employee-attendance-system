<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的补卡 · 企业员工考勤管理系统</title>
<link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
<link rel="icon" sizes="any" th:href="@{/favicon.ico}">
<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{layout/frame :: sidebar}"></div>
<div class="main">
  <header th:replace="~{layout/frame :: topbar}"></header>
  <div class="content">
    <div class="crumbs">员工系统 / 我的补卡</div>
    <div class="page-head">
      <div><h1>我的补卡</h1><p>忘记打卡在线补申请 · 审批后自动回填</p></div>
    </div>
    <div class="alert alert-success" th:if="${msg}" th:text="${msg}"></div>
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

<div class="grid grid-1-2">
  <div class="card"><div class="card-head"><h2>申请补卡</h2></div><div class="card-body">
    <form th:action="@{/my/makeup/apply}" method="post">
      <div class="field"><label>缺卡日期</label><input type="date" name="missDate" required></div>
      <div class="field" style="margin-top:14px"><label>补卡类型</label><select name="punchType">
        <option value="IN">上班卡</option><option value="OUT">下班卡</option></select></div>
      <div class="field" style="margin-top:14px"><label>补卡时间</label><input type="time" name="makeupTime" value="09:00" required></div>
      <div class="field" style="margin-top:14px"><label>补卡原因</label><textarea name="reason" rows="3" required></textarea></div>
      <div class="form-actions"><button class="btn btn-primary" type="submit">提交申请</button></div>
    </form></div></div>
  <div class="card"><div class="card-head"><h2>说明</h2></div><div class="card-body">
    <div class="hint">· 补卡申请需部门负责人审批，通过后系统自动回填打卡记录并重算迟到 / 早退。</div>
    <div class="hint">· 每人每月补卡次数纳入月度汇总统计，异常频繁会被标记为考勤风险。</div>
  </div></div>
</div>
<div class="card"><div class="card-head"><h2>我的补卡记录</h2></div>
  <div class="card-body flush"><div class="table-wrap"><table class="tbl">
    <thead><tr><th>缺卡日期</th><th>类型</th><th>补卡时间</th><th>原因</th><th>申请时间</th><th>状态</th></tr></thead>
    <tbody><tr th:each="r : ${rows}"><td th:text="${r.missDate}">-</td>
      <td><span class="badge" th:attr="data-status=${r.punchType}">-</span></td>
      <td><span data-dt th:attr="data-dt=${r.makeupTime}"></span></td><td th:text="${r.reason}">-</td>
      <td><span data-dt th:attr="data-dt=${r.applyTime}"></span></td>
      <td><span class="badge" th:attr="data-status=${r.status}">-</span></td></tr>
      <tr th:if="${#lists.isEmpty(rows)}"><td colspan="6" class="tbl-empty">暂无补卡记录</td></tr></tbody></table></div></div>
</div>

  </div>
  <div th:replace="~{layout/frame :: footer}"></div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
